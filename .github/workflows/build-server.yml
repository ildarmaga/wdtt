name: Build WDTT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unified:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WDTT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: chmod +x build.sh && ./build.sh ${{ matrix.goarch }} unified
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-linux-${{ matrix.goarch }}
          path: wdtt-linux-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unified]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wdtt-linux-*
          merge-multiple: true
          path: dist
      - name: Attach PWDTT Client (vendored binaries)
        run: |
          set -euo pipefail
          for f in pwdtt-client-linux-amd64 pwdtt-client-windows-amd64.exe pwdtt-client-version; do
            test -f "release-assets/${f}" || { echo "::error::missing release-assets/${f}"; exit 1; }
          done
          cp release-assets/pwdtt-client-linux-amd64 dist/
          cp release-assets/pwdtt-client-windows-amd64.exe dist/
          CLIENT_TAG="$(tr -d '[:space:]' < release-assets/pwdtt-client-version)"
          echo "PWDTT_CLIENT_TAG=${CLIENT_TAG}" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if grep -q "^## \[${TAG}\]" CHANGELOG.md; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          else
            echo "Нет секции ## [${TAG}] в CHANGELOG.md — добавьте перед тегом." > release-notes.md
            echo "Compare: https://github.com/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${{ github.ref_name }}" >> release-notes.md
          fi
          echo "" >> release-notes.md
          echo "Версия PWDTT Client в этом релизе: **${PWDTT_CLIENT_TAG}**" >> release-notes.md
          cat docs/RELEASE_CLIENT.md >> release-notes.md
          echo "---notes---"
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wdtt-linux-*
            dist/pwdtt-client-*
          body_path: release-notes.md
          generate_release_notes: false
