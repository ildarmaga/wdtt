name: Build WDTT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: chmod +x build.sh && ./build.sh ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-server-linux-${{ matrix.goarch }}
          path: wdtt-server-linux-${{ matrix.goarch }}

  panel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: |
          chmod +x panel/build.sh
          cd panel
          OUT="../wdtt-panel-linux-${{ matrix.goarch }}" \
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
          go build -trimpath -ldflags="-s -w" -o "../wdtt-panel-linux-${{ matrix.goarch }}" .
          chmod +x "../wdtt-panel-linux-${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-panel-linux-${{ matrix.goarch }}
          path: wdtt-panel-linux-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, panel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wdtt-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
