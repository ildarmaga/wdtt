name: Build WDTT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unified:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WDTT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: chmod +x build.sh && ./build.sh ${{ matrix.goarch }} unified
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-linux-${{ matrix.goarch }}
          path: wdtt-linux-${{ matrix.goarch }}

  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: chmod +x build.sh && ./build.sh ${{ matrix.goarch }} server
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-server-linux-${{ matrix.goarch }}
          path: wdtt-server-linux-${{ matrix.goarch }}

  panel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Panel version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WDTT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: chmod +x panel/build.sh && panel/build.sh ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-panel-linux-${{ matrix.goarch }}
          path: wdtt-panel-linux-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unified, server, panel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wdtt-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
