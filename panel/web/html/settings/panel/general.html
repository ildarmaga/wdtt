{{define "settings/panel/general"}}
<a-collapse default-active-key="1">
    <a-collapse-panel key="1" header='{{ i18n "pages.xray.generalConfigs"}}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.remarkModel"}}</template>
            <template #description>{{ i18n "pages.settings.sampleRemark"}}: <i>#[[ remarkSample ]]</i></template>
            <template #control>
                <a-input-group :style="{ width: '100%' }">
                    <a-select :style="{ paddingRight: '.5rem', minWidth: '80%', width: 'auto' }" mode="multiple"
                        v-model="remarkModel" :dropdown-class-name="themeSwitcher.currentTheme">
                        <a-select-option v-for="(value, key) in remarkModels" :value="key">[[ value ]]</a-select-option>
                    </a-select>
                    <a-select :style="{ width: '20%' }" v-model="remarkSeparator"
                        :dropdown-class-name="themeSwitcher.currentTheme">
                        <a-select-option v-for="key in remarkSeparators" :value="key">[[ key ]]</a-select-option>
                    </a-select>
                </a-input-group>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.panelListeningIP"}}</template>
            <template #description>{{ i18n "pages.settings.panelListeningIPDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.webListen"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.panelListeningDomain"}}</template>
            <template #description>{{ i18n "pages.settings.panelListeningDomainDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.webDomain"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.panelPort"}}</template>
            <template #description>{{ i18n "pages.settings.panelPortDesc"}}</template>
            <template #control>
                <a-input-number :min="1" :max="65535" v-model="allSetting.webPort" :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.panelUrlPath"}}</template>
            <template #description>{{ i18n "pages.settings.panelUrlPathDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.webBasePath"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.sessionMaxAge" }}</template>
            <template #description>{{ i18n "pages.settings.sessionMaxAgeDesc" }}</template>
            <template #control>
                <a-input-number :min="60" v-model="allSetting.sessionMaxAge" :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.pageSize" }}</template>
            <template #description>{{ i18n "pages.settings.pageSizeDesc" }}</template>
            <template #control>
                <a-input-number :min="0" step="5" v-model="allSetting.pageSize" :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.language"}}</template>
            <template #control>
                <a-select ref="selectLang" v-model="lang" @change="LanguageManager.setLanguage(lang)"
                    :dropdown-class-name="themeSwitcher.currentTheme" :style="{ width: '100%' }">
                    <a-select-option :value="l.value" :label="l.value" v-for="l in LanguageManager.supportedLanguages">
                        <span role="img" :aria-label="l.name" v-text="l.icon"></span> &nbsp;&nbsp; <span v-text="l.name"></span>
                    </a-select-option>
                </a-select>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="2" header="Брандмауэр (UFW)">
        <a-alert v-if="!allSetting.ufwInstalled" type="info" show-icon :style="{ marginBottom: '12px' }"
            message="UFW не установлен" description="Установите ufw для управления ping и портами."></a-alert>
        <a-setting-list-item paddings="small">
            <template #title>Блокировать ping (ICMP)</template>
            <template #description>
                Меняет правила в <code>/etc/ufw/before.rules</code> — блоки
                «ok icmp codes for INPUT» и «ok icmp code for FORWARD»: echo-request и другие ICMP → DROP.
                После сохранения выполняется <code>ufw reload</code>.
            </template>
            <template #control>
                <a-switch v-model="allSetting.blockPing" :disabled="!allSetting.ufwInstalled"></a-switch>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="3" header="SSH">
        <a-setting-list-item paddings="small">
            <template #title>SSH порт</template>
            <template #description>
                Текущий: <strong>[[ allSetting.sshPort ]]/tcp</strong> (из <code>/etc/ssh/sshd_config</code>).
                При смене: проверка конфига, перезапуск <code>ssh</code>
                <span v-if="allSetting.ufwActive">, открытие нового порта в UFW</span>.
            </template>
            <template #control>
                <a-input-group compact :style="{ width: '100%', display: 'flex' }">
                    <a-input-number v-model="sshForm.port" :min="1" :max="65535" placeholder="Новый порт"
                        :style="{ flex: '1 1 auto', minWidth: '120px' }"></a-input-number>
                    <a-button type="primary" :loading="sshForm.busy" :disabled="!sshForm.port || sshForm.port === allSetting.sshPort"
                        @click="changeSSHPort()">Применить</a-button>
                </a-input-group>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
</a-collapse>
{{end}}
